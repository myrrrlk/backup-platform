server {
    listen 80;
    server_name _;
    charset utf-8;

    root  /usr/share/nginx/html;
    index index.html;

    # Файлы статуса, которые записывает агент backup в общий том
    location /status/ {
        alias /status/;
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    # Проверка работоспособности для HEALTHCHECK и балансировщика
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Заголовки безопасности
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
}